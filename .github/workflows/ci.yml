name: CI

# Quality gate for every push to main and every PR into it: lint, typecheck,
# the deterministic engine suite, and a real production build.
#
# The engine tests are the valuable part — combat determinism, a 24-player
# simulation, and the Double Up flows all run headless in a few seconds. They
# existed long before this workflow but only ever ran when someone remembered
# to type `npm test`. Now they gate the branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` (not `npm install`) so the lockfile is authoritative — this is
      # also what catches a dependency that's declared but never installed.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Engine tests
        run: npm test

      # No env needed: src/game/net/firebase.ts carries public-safe fallbacks for
      # every NEXT_PUBLIC_FIREBASE_* value, so a fork PR builds without secrets.
      - name: Production build
        run: npm run build
